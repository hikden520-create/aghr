<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DZ LEGENDS 3D — Prototype</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87c9ef;font-family:system-ui,Arial;touch-action:none}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 4px #18222b;font-weight:800}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.pill{background:#102332b8;border:1px solid #ffffff60;border-radius:12px;padding:8px 12px}.health{width:150px;height:10px;background:#452a2a;border-radius:20px;overflow:hidden;margin-top:5px}.health>div{height:100%;width:100%;background:#4ee16d;transition:width .15s,background .15s}.hptext{font-size:12px;margin-top:3px}#damageFlash{position:fixed;inset:0;background:rgba(255,20,20,.42);opacity:0;pointer-events:none;z-index:5;transition:opacity .12s}#hitNotice{position:absolute;top:30%;left:50%;transform:translateX(-50%);background:#9d1d1dcc;border:1px solid #ffffff80;border-radius:12px;padding:8px 14px;opacity:0;transition:opacity .15s;font-size:16px;white-space:nowrap}.hint{position:absolute;top:72px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#102332a8;padding:7px 12px;border-radius:12px;font-size:13px}.bottom{position:absolute;bottom:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-end}.stick{width:118px;height:118px;border-radius:50%;background:#13283a55;border:2px solid #ffffff85;position:relative;pointer-events:auto;touch-action:none}.knob{position:absolute;width:48px;height:48px;left:33px;top:33px;border-radius:50%;background:#eaf6ffb8;border:2px solid white}.actions{display:flex;gap:12px;align-items:flex-end;pointer-events:auto}.action{width:68px;height:68px;border-radius:50%;border:2px solid #ffffffb0;background:#173b52b8;color:white;font-size:24px;font-weight:900;touch-action:none}.action small{display:block;font-size:10px}.shoot{width:82px;height:82px;background:#d44838d9}.reload{width:60px;height:60px;background:#b77b24d9;font-size:20px}.center{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:50%;opacity:.9}.center:after,.center:before{content:'';position:absolute;background:white}.center:after{width:2px;height:28px;left:7px;top:-6px}.center:before{height:2px;width:28px;top:7px;left:-6px}#message{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:25px;text-align:center;background:#0d263bd9;padding:18px;border-radius:18px;display:none;max-width:90vw}#restart{pointer-events:auto;border:0;border-radius:12px;padding:10px 18px;background:#53d879;font-weight:900;font-size:16px;margin-top:10px}
</style></head><body>
<div id="hud"><div class="top"><div class="pill">🇩🇿 DZ LEGENDS <div style="font-size:12px;font-weight:500">نسخة تجريبية 3D • V3</div></div><div class="pill">❤️ الصحة <div class="hptext"><span id="hpText">100</span> / 100</div><div class="health"><div id="hp"></div></div></div><div class="pill">🎯 <span id="score">0</span></div><div class="pill">🔫 <span id="ammo">30</span>/30</div></div><div class="hint">حرّك اللاعب باليسار • اسحب يمين الشاشة لتدوير الكاميرا</div><div class="center"></div><div id="hitNotice">⚠️ راك تتضرب!</div><div id="damageFlash"></div><div class="bottom"><div id="stick" class="stick"><div id="knob" class="knob"></div></div><div class="actions"><button class="action" id="jump">⬆<small>قفز</small></button><button class="action reload" id="reload">↻<small>تعبئة</small></button><button class="action shoot" id="fire">✦<small>إطلاق</small></button></div></div><div id="message">انتهت الجولة!<br><button id="restart">عاود اللعب</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
(()=>{
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8bd0f0);scene.fog=new THREE.Fog(0x8bd0f0,32,95);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,180);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdaf2ff,0x5a7142,2));const sun=new THREE.DirectionalLight(0xfff0d5,2.4);sun.position.set(-15,28,12);sun.castShadow=true;scene.add(sun);
const mat=(c,r=0.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),mat(0x5f9b4b));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// arena edges and stylized cover
for(let i=0;i<65;i++){let x=(Math.random()-.5)*115,z=(Math.random()-.5)*115;if(Math.abs(x)<8&&Math.abs(z)<10)continue;let h=1+Math.random()*3,w=1.5+Math.random()*3;const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),mat([0xc6a477,0xd5c69a,0x9aafbd,0x9d6248][i%4]));b.position.set(x,h/2,z);b.castShadow=true;b.receiveShadow=true;scene.add(b);if(i%3===0){const roof=new THREE.Mesh(new THREE.ConeGeometry(w*.85,.9,4),mat(0x9b4936));roof.position.set(x,h+.35,z);roof.rotation.y=Math.PI/4;scene.add(roof)}}
for(let i=0;i<45;i++){const x=(Math.random()-.5)*130,z=(Math.random()-.5)*130;if(Math.abs(x)<9&&Math.abs(z)<10)continue;const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.15,.25,1.5,6),mat(0x755036));trunk.position.set(x,.75,z);scene.add(trunk);const crown=new THREE.Mesh(new THREE.ConeGeometry(1.1,2.8,7),mat(0x287548));crown.position.set(x,2.6,z);crown.castShadow=true;scene.add(crown)}
const player=new THREE.Group();scene.add(player);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.75,4,8),mat(0x276b53));body.position.y=1.15;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.28,12,10),mat(0xd6a77e));head.position.y=1.9;head.castShadow=true;player.add(head);const helmet=new THREE.Mesh(new THREE.SphereGeometry(.3,12,8,0,Math.PI*2,0,Math.PI/2),mat(0x30483d));helmet.position.y=2.02;player.add(helmet);const gun=new THREE.Mesh(new THREE.BoxGeometry(.18,.16,.85),mat(0x252a2d));gun.position.set(.38,1.35,-.48);player.add(gun);
// Load the supplied GLB character; keep the simple character as a fallback if loading fails.
const gltfLoader=new GLTFLoader();gltfLoader.load('./models/player.glb',(gltf)=>{const model=gltf.scene;const box=new THREE.Box3().setFromObject(model);const size=box.getSize(new THREE.Vector3());const center=box.getCenter(new THREE.Vector3());model.position.sub(center);const maxDim=Math.max(size.x,size.y,size.z)||1;model.scale.setScalar(2.25/maxDim);model.position.y += 1.1;model.traverse((o)=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material.side=THREE.DoubleSide}}});player.add(model);body.visible=false;head.visible=false;helmet.visible=false;gun.visible=false;},undefined,(err)=>console.warn('GLB character could not be loaded; using fallback character.',err));
let yaw=0,hp=100,score=0,alive=true,vy=0,onGround=true,ammo=30,reloading=false;const bots=[];function spawnBot(){const g=new THREE.Group();const bm=new THREE.Mesh(new THREE.CapsuleGeometry(.4,.65,4,8),mat(0x9e3835));bm.position.y=1;g.add(bm);const bh=new THREE.Mesh(new THREE.SphereGeometry(.25,10,8),mat(0xc99570));bh.position.y=1.72;g.add(bh);g.position.set((Math.random()-.5)*42,0,-12-Math.random()*35);g.userData={hp:2,phase:Math.random()*6,attackCooldown:0};scene.add(g);bots.push(g)}for(let i=0;i<7;i++)spawnBot();
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let moveX=0,moveY=0,stickId=null,lookId=null,lastX=0,fireHeld=false;function setStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=(e.clientX-cx)/43,dy=(e.clientY-cy)/43;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}moveX=dx;moveY=dy;knob.style.transform=`translate(${dx*34}px,${dy*34}px)`}stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(e.pointerId);setStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)setStick(e)});function stopStick(e){if(e.pointerId===stickId){stickId=null;moveX=moveY=0;knob.style.transform='translate(0,0)'}}stick.addEventListener('pointerup',stopStick);stick.addEventListener('pointercancel',stopStick);
renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.43){lookId=e.pointerId;lastX=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)}});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId===lookId){yaw-=(e.clientX-lastX)*.008;lastX=e.clientX}});renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===lookId)lookId=null});renderer.domElement.addEventListener('pointercancel',e=>{if(e.pointerId===lookId)lookId=null});
let damageFlashTimer=0,hitNoticeTimer=0;function takeDamage(amount){if(!alive)return;hp=Math.max(0,hp-amount);const bar=document.getElementById('hp');bar.style.width=hp+'%';bar.style.background=hp>55?'#4ee16d':hp>25?'#ffd34e':'#ff4b4b';document.getElementById('hpText').textContent=Math.ceil(hp);const flash=document.getElementById('damageFlash'),notice=document.getElementById('hitNotice');flash.style.opacity='1';notice.style.opacity='1';clearTimeout(damageFlashTimer);clearTimeout(hitNoticeTimer);damageFlashTimer=setTimeout(()=>flash.style.opacity='0',180);hitNoticeTimer=setTimeout(()=>notice.style.opacity='0',650);if(hp<=0){alive=false;document.getElementById('message').innerHTML='💀 خسرت الجولة!<br><button id="restart">عاود اللعب</button>';document.getElementById('message').style.display='block';document.getElementById('restart').onclick=()=>location.reload()}}
function shoot(){if(!alive||reloading||ammo<=0)return;ammo--;document.getElementById('ammo').textContent=ammo;let best=null,bd=1e9;const dir=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));for(const b of bots){if(b.userData.hp<=0)continue;const v=b.position.clone().sub(player.position);const d=v.length();v.y=0;v.normalize();if(dir.dot(v)>.91&&d<bd){best=b;bd=d}}if(best&&bd<28){best.userData.hp--;if(best.userData.hp<=0){scene.remove(best);score++;document.getElementById('score').textContent=score;setTimeout(()=>{if(alive)spawnBot()},900)}}}
function reload(){if(!alive||reloading||ammo===30)return;reloading=true;document.getElementById('reload').innerHTML='…<small>تعبئة</small>';setTimeout(()=>{if(alive){ammo=30;document.getElementById('ammo').textContent=ammo}reloading=false;document.getElementById('reload').innerHTML='↻<small>تعبئة</small>'},1300)}document.getElementById('reload').addEventListener('pointerdown',e=>{e.preventDefault();reload()});
const fire=document.getElementById('fire');fire.addEventListener('pointerdown',e=>{e.preventDefault();fireHeld=true;shoot()});fire.addEventListener('pointerup',()=>fireHeld=false);fire.addEventListener('pointercancel',()=>fireHeld=false);document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();if(onGround&&alive){vy=7;onGround=false}});
document.getElementById('restart').onclick=()=>location.reload();let prev=performance.now(),fireTimer=0;function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-prev)/1000,.04);prev=now;if(alive){const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));const dir=forward.clone().multiplyScalar(-moveY).add(right.multiplyScalar(moveX));if(dir.lengthSq()>0){dir.normalize();player.position.addScaledVector(dir,6*dt);player.rotation.y=Math.atan2(-dir.x,-dir.z)}vy-=17*dt;player.position.y+=vy*dt;if(player.position.y<=0){player.position.y=0;vy=0;onGround=true}player.position.x=THREE.MathUtils.clamp(player.position.x,-65,65);player.position.z=THREE.MathUtils.clamp(player.position.z,-65,65);for(const b of bots){if(b.userData.hp<=0)continue;const v=player.position.clone().sub(b.position);const d=v.length();if(d>2.0&&d<36){v.y=0;v.normalize();b.position.addScaledVector(v,dt*(d<7?1.5:2.2));b.rotation.y=Math.atan2(-v.x,-v.z)}b.userData.attackCooldown=Math.max(0,b.userData.attackCooldown-dt);if(d<2.35&&b.userData.attackCooldown<=0){b.userData.attackCooldown=1.0;takeDamage(12)}}fireTimer-=dt;if(fireHeld&&fireTimer<=0){shoot();fireTimer=.35}}
const target=new THREE.Vector3(player.position.x,player.position.y+1.45,player.position.z);const behind=new THREE.Vector3(Math.sin(yaw)*6,3.2,Math.cos(yaw)*6);camera.position.lerp(target.clone().add(behind),.13);camera.lookAt(target);renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script></body></html>
